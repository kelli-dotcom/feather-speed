<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 290" width="100%" height="100%">
  <defs>
    <linearGradient id="emBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041510"/>
      <stop offset="55%" stop-color="#08281e"/>
      <stop offset="100%" stop-color="#03110d"/>
    </linearGradient>
    <linearGradient id="emLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="290" rx="14" fill="url(#emBg)" stroke="#10b981" stroke-width="2"/>
  <!-- Telemetry Baseline Grid -->
  <g stroke="#10b981" stroke-width="0.7" opacity="0.14">
    <line x1="0" y1="72" x2="1080" y2="72"/>
    <line x1="0" y1="145" x2="1080" y2="145"/>
    <line x1="0" y1="218" x2="1080" y2="218"/>
  </g>

  <!-- Left Title Block -->
  <text x="52" y="62" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2.2">🟢 FEATHER-SPEED // ADAPTIVE HARDWARE ENGINE · 0 DEPS</text>
  <text x="52" y="114" fill="#ecfdf5" font-family="Lora, Georgia, serif" font-size="42" font-weight="600">Feather Speed</text>
  <rect x="52" y="128" width="350" height="3.5" rx="2" fill="url(#emLine)"/>
  <text x="52" y="162" fill="#a7f3d0" font-family="'Source Sans 3', system-ui, -apple-system, sans-serif" font-size="16">Auto-tunes DOM rendering, worker concurrency, and DB pools to real RAM &amp; CPU cores.</text>
  <text x="52" y="186" fill="#6ee7b7" font-family="'Source Sans 3', system-ui, -apple-system, sans-serif" font-size="14.5">Fast on 2–4 GB school Chromebooks and older phones — full throttle on 16 GB+ workstations.</text>

  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">
    <rect x="52" y="210" width="150" height="34" rx="7" fill="#063024" stroke="#10b981" stroke-width="1.5"/>
    <text x="127" y="231" fill="#ecfdf5" text-anchor="middle">0 DEPENDENCIES</text>

    <rect x="214" y="210" width="176" height="34" rx="7" fill="#063024" stroke="#34d399" stroke-width="1.3"/>
    <text x="302" y="231" fill="#a7f3d0" text-anchor="middle">BROWSER + NODE:OS</text>

    <rect x="402" y="210" width="176" height="34" rx="7" fill="#063024" stroke="#34d399" stroke-width="1.3"/>
    <text x="490" y="231" fill="#6ee7b7" text-anchor="middle">LIVE SIMULATOR ↗</text>
  </g>

  <!-- Right Panel: 3 Emerald Hardware Telemetry Gauges -->
  <g transform="translate(612, 34)" font-family="ui-monospace, SFMono-Regular, monospace">
    <!-- ECO Gauge -->
    <rect x="0" y="0" width="136" height="222" rx="10" fill="#06221a" stroke="#059669" stroke-width="1.5"/>
    <text x="68" y="26" fill="#6ee7b7" font-size="11.5" font-weight="800" text-anchor="middle">ECO TIER</text>
    <text x="68" y="42" fill="#a7f3d0" font-size="10" text-anchor="middle">&lt;= 2 GB RAM</text>
    <!-- Gauge Arc (33% fill) -->
    <path d="M 28 112 A 40 40 0 0 1 108 112" fill="none" stroke="#134e3a" stroke-width="9" stroke-linecap="round"/>
    <path d="M 28 112 A 40 40 0 0 1 54 75" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
    <text x="68" y="108" fill="#ecfdf5" font-size="15" font-weight="800" text-anchor="middle">20 DOM</text>
    <text x="68" y="146" fill="#a7f3d0" font-size="10.5" text-anchor="middle">Workers: 4</text>
    <text x="68" y="166" fill="#a7f3d0" font-size="10.5" text-anchor="middle">DB Pool: 4</text>
    <text x="68" y="186" fill="#a7f3d0" font-size="10.5" text-anchor="middle">Batch: 25</text>
    <text x="68" y="206" fill="#34d399" font-size="9.5" text-anchor="middle">0 Blur · Save-Data</text>

    <!-- BALANCED Gauge -->
    <rect x="148" y="0" width="136" height="222" rx="10" fill="#072b21" stroke="#10b981" stroke-width="1.8"/>
    <text x="216" y="26" fill="#34d399" font-size="11.5" font-weight="800" text-anchor="middle">BALANCED</text>
    <text x="216" y="42" fill="#a7f3d0" font-size="10" text-anchor="middle">4–8 GB RAM</text>
    <!-- Gauge Arc (66% fill) -->
    <path d="M 176 112 A 40 40 0 0 1 256 112" fill="none" stroke="#134e3a" stroke-width="9" stroke-linecap="round"/>
    <path d="M 176 112 A 40 40 0 0 1 244 82" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
    <text x="216" y="108" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">50 DOM</text>
    <text x="216" y="146" fill="#d1fae5" font-size="10.5" text-anchor="middle">Workers: 16</text>
    <text x="216" y="166" fill="#d1fae5" font-size="10.5" text-anchor="middle">DB Pool: 10</text>
    <text x="216" y="186" fill="#d1fae5" font-size="10.5" text-anchor="middle">Batch: 75</text>
    <text x="216" y="206" fill="#6ee7b7" font-size="9.5" text-anchor="middle">GPU-Only Motion</text>

    <!-- ULTRA Gauge -->
    <rect x="296" y="0" width="136" height="222" rx="10" fill="#06221a" stroke="#34d399" stroke-width="1.5"/>
    <text x="364" y="26" fill="#6ee7b7" font-size="11.5" font-weight="800" text-anchor="middle">ULTRA TIER</text>
    <text x="364" y="42" fill="#a7f3d0" font-size="10" text-anchor="middle">16 GB+ RAM</text>
    <!-- Gauge Arc (100% fill) -->
    <path d="M 324 112 A 40 40 0 0 1 404 112" fill="none" stroke="#134e3a" stroke-width="9" stroke-linecap="round"/>
    <path d="M 324 112 A 40 40 0 0 1 404 112" fill="none" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round"/>
    <text x="364" y="108" fill="#ecfdf5" font-size="15" font-weight="800" text-anchor="middle">100 DOM</text>
    <text x="364" y="146" fill="#a7f3d0" font-size="10.5" text-anchor="middle">Workers: 32</text>
    <text x="364" y="166" fill="#a7f3d0" font-size="10.5" text-anchor="middle">DB Pool: 20</text>
    <text x="364" y="186" fill="#a7f3d0" font-size="10.5" text-anchor="middle">Batch: 200</text>
    <text x="364" y="206" fill="#34d399" font-size="9.5" text-anchor="middle">Full Prefetch</text>
  </g>
</svg>
